name = "amul-watch"
main = "src/worker.js"
compatibility_date = "2026-09-01"
account_id = "6d2cf54c3cf43ddb1abfa18609be7c09"

# Every minute, which is as often as Cloudflare will schedule a cron.
# 1440 invocations/day against a 100k/day limit.
[triggers]
crons = ["* * * * *"]

[vars]
# private   = only ADMIN_CHAT_ID
# allowlist = admin plus anyone added with /allow   <- start here
# public    = anyone who finds the bot
# Sweeps performed inside each firing, spread evenly over the minute: 2 means a
# product is looked at every 30s. The Workers free plan caps CPU at 10ms per
# invocation. Measured live on 2026-10-24: 1 sweep ~5ms, 2 sweeps 6-8ms (each
# extra sweep is one Amul request, ~2-3ms), so 3 would sit at the limit. Before
# the session reuse a sweep cost ~9ms and 3 got a quarter of firings killed.
SWEEPS_PER_RUN = "2"

# 1 = users who opt in with /amullogin get restocked items added to their own
# Amul cart, with an "Open cart & checkout" button on the alert. Logins are
# stored encrypted with the LOGIN_ENC_KEY secret. Never pays for anything.
AUTO_CART = "1"

ACCESS_MODE = "allowlist"

# ADMIN_CHAT_ID is a secret, not a var, so it stays out of the repo:
#   npx wrangler secret put ADMIN_CHAT_ID

[[d1_databases]]
binding = "DB"
database_name = "amul-watch"
database_id = "4e2e9993-ea54-41f4-a809-d642c4690492"

[observability]
enabled = true
