name = "amul-watch"
main = "src/worker.js"
compatibility_date = "2026-09-01"
account_id = "6d2cf54c3cf43ddb1abfa18609be7c09"

# Every minute, which is as often as Cloudflare will schedule a cron.
# 1440 invocations/day against a 100k/day limit.
[triggers]
crons = ["* * * * *"]

[vars]
# private   = only ADMIN_CHAT_ID
# allowlist = admin plus anyone added with /allow   <- start here
# public    = anyone who finds the bot
# Sweeps performed inside each firing. The Workers free plan caps CPU at 10ms
# per invocation, and almost all of it is spent awaiting I/O. A check is one
# batched D1 read, one Amul request on a saved session and one batched write;
# the catalogue refresh runs after the heartbeat. Before that a sweep measured
# ~9ms median and three sweeps got a quarter of all firings killed. Leave this
# at 1 unless on Workers Paid.
SWEEPS_PER_RUN = "1"

# 1 = when something the owner watches comes back in stock, also add it to the
# owner's own Amul cart and put an "Open cart & checkout" button on the alert.
# It signs in with the owner's login cookie (send /amullogin to the bot), so it
# does nothing until one is saved. Never pays for anything.
AUTO_CART = "0"

ACCESS_MODE = "allowlist"

# ADMIN_CHAT_ID is a secret, not a var, so it stays out of the repo:
#   npx wrangler secret put ADMIN_CHAT_ID

[[d1_databases]]
binding = "DB"
database_name = "amul-watch"
database_id = "4e2e9993-ea54-41f4-a809-d642c4690492"

[observability]
enabled = true
